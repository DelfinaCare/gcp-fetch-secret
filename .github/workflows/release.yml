name: Release

# Works with immutable releases: once a release is published its assets and
# tag can no longer change, so everything is uploaded to a *draft* release
# first and the release is published as the very last step. Pushing a `vX.Y.Z`
# tag starts the process; don't create the release by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never run two releases for the same tag at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  check-version:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare versions
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${TAG#v}" != "$CARGO_VERSION" ]; then
            echo "::error::Release tag $TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

  create-draft:
    name: Create draft release
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create or reuse draft release
        run: |
          # On a re-run the draft from the earlier attempt is reused. A
          # published release is immutable, so refuse to touch it.
          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG is already published"
              exit 1
            fi
            echo "Reusing existing draft release $TAG"
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG"
          fi

  # Multi-arch strategy: unlike gcp-log-csp (which builds both arches on one
  # runner under QEMU), this builds each arch on a native runner and merges
  # the per-arch images into one manifest list afterwards. The Google Cloud
  # SDK pulls in ~270 crates plus aws-lc (C), which takes ~2 minutes natively
  # and far longer under emulation.
  build-image:
    name: Build Image (${{ matrix.platform }})
    needs: create-draft
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Image names must be lowercase; github.repository may not be.
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: Publish multi-arch image
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload SBOM to the draft release
      packages: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Prepare
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"

      - name: Get manifest list digest
        id: manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          output-file: ${{ runner.temp }}/gcp-fetch-secret.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM to draft release
        run: gh release upload "$TAG" "${{ runner.temp }}/gcp-fetch-secret.spdx.json" --clobber

  build-binaries:
    name: Build Binary (${{ matrix.asset_name }})
    needs: create-draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: gcp-fetch-secret-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_name: gcp-fetch-secret-linux-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-auditable
        # Built from the versions locked in tools/Cargo.lock.
        run: |
          cargo build --release --locked --manifest-path tools/Cargo.toml -p cargo-auditable --bin cargo-auditable
          cp tools/target/release/cargo-auditable "${CARGO_HOME:-$HOME/.cargo}/bin/"

      - name: Build
        run: cargo auditable build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/gcp-fetch-secret ${{ matrix.asset_name }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.asset_name }}

      - name: Upload binary to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset_name }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  publish-release:
    name: Publish release
    # Only once every asset is attached: after this the release is immutable.
    needs: [publish-image, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish draft release
        run: gh release edit "$TAG" --draft=false
