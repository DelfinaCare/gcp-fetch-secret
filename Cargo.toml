[package]
name = "secretsfetch"
version = "0.1.0"
edition = "2024"
description = "Fetches secrets from GCP Secret Manager into env files and secret files, and keeps them up to date"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
google-cloud-auth = "1.18"
google-cloud-secretmanager-v1 = "1.14"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[dev-dependencies]
axum = "0.8"
base64 = "0.23"
tokio = { version = "1", features = ["process", "test-util"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
